<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit & Create PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e5e9f2;padding:14px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.logo{font-weight:800;font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.upload{border:0;border-radius:10px;padding:10px 14px;background:#eef2f8;color:#172033;font-weight:700;cursor:pointer}
button.primary,.upload.primary{background:#2563eb;color:#fff}.danger{background:#fee2e2!important;color:#b91c1c!important}
input[type=file]{display:none}
main{max-width:1200px;margin:22px auto;padding:0 16px}
.toolbar{background:#fff;border:1px solid #e3e8f1;border-radius:16px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 25px #00000008}
.toolbar label{font-size:13px;font-weight:700}.toolbar input[type=color]{width:38px;height:34px;padding:2px;border:1px solid #ddd;border-radius:8px}
.toolbar input[type=number]{width:68px;padding:9px;border:1px solid #dbe1ea;border-radius:8px}
.workspace{margin-top:16px;display:grid;grid-template-columns:250px 1fr;gap:16px}
.sidebar,.canvas-area{background:#fff;border:1px solid #e3e8f1;border-radius:16px}
.sidebar{padding:12px;min-height:620px;overflow-y:auto}.sidebar h3{margin:4px 4px 12px;font-size:14px}
.thumbs{display:flex;flex-direction:column;gap:12px}.thumb{border:2px solid transparent;border-radius:10px;padding:6px;background:#f7f8fb;cursor:pointer;transition:all 0.2s}.thumb:hover{background:#f0f4fa;border-color:#d1d5db}.thumb.active{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}.thumb canvas{width:100%;display:block;background:#fff;border-radius:6px}.thumb small{display:block;font-size:11px;color:#667085;margin-top:6px;text-align:center;font-weight:500}
.canvas-area{padding:18px;overflow:auto;min-height:620px}.empty{text-align:center;padding:130px 20px;color:#697386}.page-wrap{position:relative;margin:0 auto 20px;width:max-content;background:white;box-shadow:0 8px 30px #0002}.page-wrap canvas{display:block}.overlay{position:absolute;inset:0}.overlay-item{position:absolute;user-select:none;cursor:move;white-space:pre-wrap}.text-item{font-weight:500}.draw-layer{position:absolute;inset:0;pointer-events:none}
.hint{font-size:13px;color:#667085;margin-top:8px}
@media(max-width:800px){.workspace{grid-template-columns:1fr}.sidebar{min-height:auto;max-height:200px}.thumbs{flex-direction:row;gap:8px;overflow-x:auto}.thumb{min-width:100px;flex-shrink:0}.canvas-area{min-height:500px}}
</style>
</head>
<body>
<header>
  <div class="logo">PDF Editor</div>
  <div class="actions">
    <label class="upload primary"><input id="fileInput" type="file" accept="application/pdf">Open PDF</label>
    <button id="newPdf">New PDF</button>
    <button class="primary" id="savePdf">Download PDF</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <button id="addText">Add Text</button>
    <button id="draw">Draw</button>
    <button id="erase">Erase</button>
    <button id="addPage">Add Blank Page</button>
    <button id="deletePage" class="danger">Delete Page</button>
    <label>Text size <input id="fontSize" type="number" min="8" max="96" value="20"></label>
    <label>Color <input id="color" type="color" value="#111827"></label>
    <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button>
  </div>
  <div class="hint">Upload a PDF to annotate it, add text, draw, add/remove pages, or start a new PDF. Existing PDF text is preserved; this editor adds editable overlay content.</div>

  <section class="workspace">
    <aside class="sidebar">
      <h3>Pages</h3>
      <div id="thumbs" class="thumbs"></div>
    </aside>
    <section id="canvasArea" class="canvas-area">
      <div class="empty" id="empty">
        <h2>Edit or create a PDF</h2>
        <p>Open a PDF or click "New PDF" to begin.</p>
      </div>
    </section>
  </section>
</main>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const {PDFDocument,rgb,StandardFonts}=PDFLib;
const fileInput=document.getElementById("fileInput"), thumbs=document.getElementById("thumbs"), area=document.getElementById("canvasArea");
const empty=document.getElementById("empty"), fontSize=document.getElementById("fontSize"), color=document.getElementById("color"), zoomLabel=document.getElementById("zoomLabel");
let pdfDoc=null, sourceBytes=null, pages=[], current=0, zoom=1, mode="select";

function hexRgb(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]}
function blankPage(){return {width:595,height:842,source:null,items:[],draws:[]}}
function setMode(m){mode=m; document.querySelectorAll(".toolbar button").forEach(b=>b.classList.remove("primary")); if(m==="text")document.getElementById("addText").classList.add("primary"); if(m==="draw")document.getElementById("draw").classList.add("primary")}

async function renderThumbs(){
  thumbs.innerHTML="";
  for(let i=0;i<pages.length;i++){
    const p=pages[i];
    const d=document.createElement("div");
    d.className="thumb"+(i===current?" active":"");
    const canvas=document.createElement("canvas");
    canvas.width=200;
    canvas.height=280;
    
    // Render page content to thumbnail
    const scale=200/p.width;
    canvas.height=p.height*scale;
    const ctx=canvas.getContext("2d");
    
    if(p.source && sourceBytes && pdfDoc){
      try{
        const src=await pdfDoc.getPage(p.source);
        const vp=src.getViewport({scale});
        canvas.width=vp.width;
        canvas.height=vp.height;
        await src.render({canvasContext:ctx,viewport:vp}).promise;
      }catch(e){}
    }else{
      ctx.fillStyle="#fff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle="#e3e8f1";
      ctx.lineWidth=1;
      ctx.strokeRect(0,0,canvas.width,canvas.height);
    }
    
    // Draw text items on thumbnail
    p.items.forEach(it=>{
      ctx.font=`${Math.max(8,it.size*scale/2)}px Arial`;
      ctx.fillStyle=it.color||"#000";
      ctx.fillText(it.text.substring(0,20),it.x*scale,it.y*scale);
    });
    
    // Draw lines on thumbnail
    p.draws.forEach(d=>{
      ctx.strokeStyle=d.color||"#000";
      ctx.lineWidth=Math.max(1,d.width*scale);
      ctx.beginPath();
      ctx.moveTo(d.x1*scale,d.y1*scale);
      ctx.lineTo(d.x2*scale,d.y2*scale);
      ctx.stroke();
    });
    
    d.appendChild(canvas);
    const small=document.createElement("small");
    small.textContent=`Page ${i+1}`;
    d.appendChild(small);
    d.onclick=()=>{current=i;render();renderThumbs()};
    thumbs.appendChild(d);
  }
}

async function render(){
  empty.style.display=pages.length?"none":"block"; if(!pages.length)return;
  area.querySelectorAll(".page-wrap").forEach(x=>x.remove());
  const p=pages[current], wrap=document.createElement("div");wrap.className="page-wrap";
  const canvas=document.createElement("canvas"); const scale=zoom; canvas.width=p.width*scale;canvas.height=p.height*scale;
  wrap.appendChild(canvas); const overlay=document.createElement("div");overlay.className="overlay";wrap.appendChild(overlay); area.appendChild(wrap);
  if(p.source){
    try{
      const src=await pdfDoc.getPage(p.source); const vp=src.getViewport({scale}); canvas.width=vp.width;canvas.height=vp.height; wrap.style.width=vp.width+"px";
      await src.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
    }catch(e){}
  }else{
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  p.items.forEach((it,idx)=>{
    const el=document.createElement("div");el.className="overlay-item text-item";el.textContent=it.text;
    el.style.left=(it.x*zoom)+"px";el.style.top=(it.y*zoom)+"px";el.style.fontSize=(it.size*zoom)+"px";el.style.color=it.color;
    el.title="Drag to move • Double-click to edit";
    el.ondblclick=()=>{const v=prompt("Edit text",it.text);if(v!==null){it.text=v;render();renderThumbs()}};
    let sx,sy,ox,oy;el.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;ox=it.x;oy=it.y;el.setPointerCapture(e.pointerId)};
    el.onpointermove=e=>{if(e.buttons!==1)return;it.x=ox+(e.clientX-sx)/zoom;it.y=oy+(e.clientY-sy)/zoom;el.style.left=it.x*zoom+"px";el.style.top=it.y*zoom+"px"};
    overlay.appendChild(el);
  });
  if(mode==="draw"){
    const draw=document.createElement("canvas");draw.className="draw-layer";draw.width=canvas.width;draw.height=canvas.height;draw.style.pointerEvents="auto";overlay.appendChild(draw);
    const ctx=draw.getContext("2d");ctx.lineWidth=2*zoom;ctx.lineCap="round";ctx.strokeStyle=color.value;
    let drawing=false,last=null;
    draw.onpointerdown=e=>{drawing=true;last=[e.offsetX,e.offsetY];};
    draw.onpointermove=e=>{if(!drawing)return;ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();p.draws.push({x1:last[0]/zoom,y1:last[1]/zoom,x2:e.offsetX/zoom,y2:e.offsetY/zoom,color:color.value,width:2});last=[e.offsetX,e.offsetY]};
    draw.onpointerup=()=>{drawing=false;renderThumbs()};
    draw.onpointerleave=()=>drawing=false;
  }
}
async function loadPdf(file){
  sourceBytes=await file.arrayBuffer();pdfDoc=await pdfjsLib.getDocument({data:sourceBytes.slice(0)}).promise;pages=[];
  for(let i=1;i<=pdfDoc.numPages;i++){const pg=await pdfDoc.getPage(i);const v=pg.getViewport({scale:1});pages.push({width:v.width,height:v.height,source:i,items:[],draws:[]})}
  current=0;zoom=1;updateZoom();renderThumbs();render();
}
async function createNew(){pdfDoc=null;sourceBytes=null;pages=[blankPage()];current=0;zoom=1;updateZoom();renderThumbs();render()}
function updateZoom(){zoomLabel.textContent=Math.round(zoom*100)+"%"}
fileInput.onchange=e=>{if(e.target.files[0])loadPdf(e.target.files[0])};
document.getElementById("newPdf").onclick=createNew;
document.getElementById("addText").onclick=()=>{setMode("text");if(!pages.length)createNew();const p=pages[current];p.items.push({text:"New text",x:50,y:60,size:+fontSize.value,color:color.value});setMode("select");render();renderThumbs()};
document.getElementById("draw").onclick=()=>{setMode(mode==="draw"?"select":"draw");render()};
document.getElementById("erase").onclick=()=>{if(!pages.length)return;pages[current].items.pop();pages[current].draws.pop();render();renderThumbs()};
document.getElementById("addPage").onclick=()=>{pages.splice(current+1,0,blankPage());current++;renderThumbs();render()};
document.getElementById("deletePage").onclick=()=>{if(pages.length<=1){alert("A PDF needs at least one page.");return}pages.splice(current,1);current=Math.max(0,current-1);renderThumbs();render()};
document.getElementById("zoomIn").onclick=()=>{zoom=Math.min(2.5,zoom+.1);updateZoom();render()};
document.getElementById("zoomOut").onclick=()=>{zoom=Math.max(.5,zoom-.1);updateZoom();render()};

async function save(){
  if(!pages.length){alert("Open a PDF or create a new one first.");return}
  const out=await PDFDocument.create();
  const font=await out.embedFont(StandardFonts.Helvetica);
  for(const p of pages){
    let page;
    if(p.source && sourceBytes){
      const src=await PDFDocument.load(sourceBytes);
      const copied=await out.copyPages(src,[p.source-1]); page=copied[0];out.addPage(page);
    }else page=out.addPage([p.width,p.height]);
    const [r,g,b]=hexRgb(color.value);
    for(const it of p.items){
      const [ir,ig,ib]=hexRgb(it.color||color.value);
      page.drawText(it.text,{x:it.x,y:p.height-it.y-it.size,size:it.size,font,color:rgb(ir,ig,ib)});
    }
    for(const d of p.draws){
      const [dr,dg,db]=hexRgb(d.color||color.value);
      page.drawLine({start:{x:d.x1,y:p.height-d.y1},end:{x:d.x2,y:p.height-d.y2},thickness:d.width,color:rgb(dr,dg,db)});
    }
  }
  const bytes=await out.save();const blob=new Blob([bytes],{type:"application/pdf"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="edited-document.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("savePdf").onclick=save;
createNew();
</script>
</body>
</html>
