<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – ConvertKit Lite</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/favicon-192x192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650&family=Poppins:wght@700;850&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030712;--card:rgba(5,15,30,.85);--line:rgba(55,150,255,.38);
  --blue:#168cff;--cyan:#00d9ff;--purple:#a83cff;--pink:#e638ff;
  --text:#f7fbff;--muted:#a8b6ca;
}
body{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--bg);color:var(--text);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  text-align:center;overflow-x:hidden;position:relative;
}
body:before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
   radial-gradient(circle at 76% 24%,rgba(0,142,255,.18),transparent 25%),
   radial-gradient(circle at 48% 74%,rgba(151,28,255,.12),transparent 30%),
   linear-gradient(125deg,#02050c,#07101d 48%,#03050b);
}
body:after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.2;
  background-image:
   linear-gradient(rgba(40,140,255,.10) 1px,transparent 1px),
   linear-gradient(90deg,rgba(40,140,255,.10) 1px,transparent 1px);
  background-size:58px 58px;
  mask-image:radial-gradient(circle at 50% 40%,black,transparent 75%);
}
.box{
  max-width:480px;padding:44px 34px;border:1px solid var(--line);border-radius:22px;
  background:var(--card);backdrop-filter:blur(18px);
  box-shadow:0 25px 80px #000b,inset 0 0 50px #087dff0c;
}
.logo{width:52px;height:52px;border-radius:12px;overflow:hidden;margin:0 auto 20px;box-shadow:0 0 25px #157dff55}
.logo img{width:100%;height:100%;display:block}
.code{
  font-family:Poppins,"Segoe UI",sans-serif;font-weight:850;font-size:84px;line-height:1;
  background:linear-gradient(90deg,var(--blue),var(--purple) 55%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-family:Poppins,"Segoe UI",sans-serif;font-weight:700;font-size:24px;margin:16px 0 10px;letter-spacing:-.4px}
p{color:var(--muted);line-height:1.7;margin-bottom:28px;font-size:15px}
a.btn{
  display:inline-block;padding:13px 26px;border-radius:999px;color:#fff;text-decoration:none;
  font-weight:650;font-size:15px;background:linear-gradient(100deg,#087fff,#c832ff);
  box-shadow:0 0 28px #583dff55;
}
a.btn:hover{box-shadow:0 0 35px #583dff88}
.tools{margin-top:24px;font-size:13.5px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px}
.tools a{color:#68caff;text-decoration:none;padding:4px 8px}
.tools a:hover{text-decoration:underline}
.dot{color:#2a3b52}
@media(max-width:480px){.box{padding:34px 22px}.code{font-size:64px}}
</style>
</head>
<body>
<main class="box">
  <div class="logo"><img src="/favicon-192x192.png" alt="ConvertKit Lite logo"></div>
  <div class="code">404</div>
  <h1>This page doesn't exist (yet)</h1>
  <p>The link may be wrong, or the tool you're looking for isn't ready. Head back home and pick a tool.</p>
  <a class="btn" href="/">Back to ConvertKit Lite</a>
  <div class="tools">
    <a href="/tools/merge-pdf.html">Merge PDF</a><span class="dot">·</span>
    <a href="/tools/split-pdf.html">Split PDF</a><span class="dot">·</span>
    <a href="/tools/compress-pdf.html">Compress</a><span class="dot">·</span>
    <a href="/tools/pdf-to-word.html">PDF to Word</a><span class="dot">·</span>
    <a href="/tools/word-to-pdf.html">Word to PDF</a>
  </div>
</main>
</body>
</html>
